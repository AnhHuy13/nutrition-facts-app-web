<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriGen — Tạo nhãn</title>
    <link rel="stylesheet" href="css/trangchu.css" />
    <link rel="stylesheet" href="css/navbar.css" />
  </head>
  <body>
    <aside class="vertical-panel" id="sidebar" aria-label="Điều hướng chính">
      <div class="sidebar-header">
        <div class="panel-logo">
          <img src="assets/logo.png" alt="" />
          <h2>NutriGen</h2>
        </div>
        <button class="sidebar-close" id="closeSidebar" type="button" aria-label="Đóng menu">
          ×
        </button>
      </div>
      <nav class="panel-menu" aria-label="Menu chính">
        <a href="#" class="active" aria-current="page">Tạo nhãn</a>
        <a href="#">Quản lý nhãn đã tạo</a>
      </nav>
      <div class="panel-footer"><a href="#">Đăng xuất</a></div>
    </aside>
    <div class="sidebar-overlay" aria-hidden="true"></div>

    <main class="main-content">
      <div class="content-area">
        <button
          class="menu-toggle"
          id="menuToggle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Mở menu"
        >
          ☰
        </button>
        <nav class="product-tabs" id="product-tabs" aria-label="Sản phẩm" role="tablist">
          <button
            class="add-product-tab"
            id="add-product"
            type="button"
            aria-label="Tạo sản phẩm mới"
            title="Tạo sản phẩm mới"
          >
            +
          </button>
        </nav>

        <div class="workbench">
          <section class="upper-workspace" aria-label="Thông tin và xem trước nhãn">
            <section class="product-editor" aria-label="Thông tin sản phẩm và chất đa lượng">
              <div class="product-basics">
                <label class="form-field product-name-field">
                  <span>Tên sản phẩm</span>
                  <input
                    class="form-control"
                    id="product-name"
                    type="text"
                    placeholder="Nhập tên sản phẩm"
                  />
                </label>
                <label class="form-field serving-weight-field">
                  <span>Trọng lượng 1 serving</span>
                  <span class="unit-input">
                    <input
                      class="form-control"
                      id="serving-weight"
                      type="number"
                      min="0"
                      step="1"
                    />
                    <span class="unit-suffix">g</span>
                  </span>
                </label>
                <label class="form-field servings-field">
                  <span>Số lượng serving</span>
                  <input class="form-control" id="servings-count" type="number" min="0" step="1" />
                </label>
                <div class="form-field calories-field">
                  <span class="calories-heading">
                    <label for="calories-input">Calories</label>
                    <span class="auto-calories-toggle">
                      <input id="auto-calories" type="checkbox" checked />
                      <label for="auto-calories">Tự động</label>
                    </span>
                  </span>
                  <input class="form-control" id="calories-input" type="number" min="0" step="1" />
                </div>
                <label class="form-field serving-unit-field">
                  <span>Đơn vị khẩu phần <span class="optional-note">(không bắt buộc)</span></span>
                  <input
                    class="form-control"
                    id="serving-unit"
                    type="text"
                    placeholder="Ví dụ: 2 cái, 1 gói"
                  />
                </label>
              </div>

              <div class="nutrient-columns" id="macro-fields" aria-label="Chất đa lượng"></div>
            </section>

            <section class="preview-panel" aria-label="Xem trước nhãn">
              <div class="preview-stage" id="preview-stage"></div>
            </section>

            <section class="file-panel" aria-label="Tên file">
              <label class="form-field">
                <span class="file-label">Tên file:</span>
                <input
                  class="form-control"
                  id="filename-input"
                  type="text"
                  value="nutrition-label.svg"
                />
              </label>
              <p class="file-hint">Sẽ tải xuống dưới dạng SVG.</p>
            </section>
          </section>

          <section class="lower-workspace" aria-label="Vi chất và xuất nhãn">
            <section class="micronutrient-panel" aria-label="Vitamin và khoáng chất">
              <h2>Mỗi khẩu phần</h2>
              <div class="micronutrient-fields" id="micro-fields"></div>
            </section>

            <section class="export-panel" aria-label="Xuất nhãn">
              <div class="export-one-image-div">
                <button class="button button-primary" id="export-current" type="button">
                  Xuất ra file hình
                </button>
                <button class="button button-primary" id="copy-image" type="button">
                  Copy ảnh
                </button>
              </div>
              <button class="button" id="export-all" type="button">Xuất toàn bộ</button>
              <output class="export-status" id="export-status" aria-live="polite"
                >Sẵn sàng xuất SVG</output
              >
            </section>

            <section class="code-panel" aria-label="Mã SVG">
              <textarea
                id="svg-code"
                class="code-editor"
                readonly
                spellcheck="false"
                aria-label="Mã SVG đang xem trước"
              ></textarea>
            </section>
          </section>
        </div>
      </div>
    </main>

    <div class="tab-context-menu" id="tab-context-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-action="create">Tạo Sản phẩm mới</button>
      <button type="button" role="menuitem" data-action="delete">Xoá Sản phẩm</button>
    </div>

    <canvas id="canvasElement" style="display: none"></canvas>

    <script type="module" src="js/trangchu.js"></script>
    <script type="module" src="js/navbar.js"></script>
  </body>
</html>
